# Shared defaults. Phase files override this file and are what the CLI loads.
# Tune only with a measured reason recorded in docs/BENCH.md.
run:
  base_slug: qwen3-1.7b
  phase: cpt
  hub_repo: null          # e.g. "<user>/t4-llm-<domain>" (private)
  data_repo: null         # e.g. "<user>/t4-llm-data" (private, revision-pinned)
  data_revision: null     # content-addressed revision written by `make data`
  seed: 3407

model:
  base: "Qwen/Qwen3-1.7B-Base"   # fallback: Qwen3-0.6B-Base, gemma-3-1b-pt
  load_in_4bit: false            # true ONLY if base >= 4B (or OOM ladder, logged)
  attn: "sdpa"
  gradient_checkpointing: "unsloth"
  trust_remote_code: false

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  use_rslora: true
  target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  dtype: fp16
  seq_len: 2048
  micro_batch: 2
  grad_accum: 16                 # effective ~= 65k tokens/step
  lr: 0.00015
  scheduler: cosine
  warmup_ratio: 0.02
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: "paged_adamw_8bit"
  max_steps: 20000
  logging_steps: 1

resilience:
  ckpt_every_minutes: 6
  ckpt_every_steps: 60
  heartbeat_seconds: 120
  time_budget_minutes: 20        # per subprocess invocation
  keep_last: 3
  keep_milestones_every: 1000
  push_backpressure_minutes: 15
  resume_loss_tolerance: 0.05
  max_rollbacks: 3

data:
  revision: null
  seq_len: 2048
  local_dir: null
  source_manifest: null
  max_tokens_per_shard: 50000000  # ~100 MB fp16 packed tokens

eval:
  domain_set: null
  general_samples: 512
  seed: 3407
